App As appinfo:
    BackEnabled: =true
    OnStart: |-
        =// 1. Create two separate collections so their columns don't clash!
        ClearCollect(colAppleEOL, 'iOS_end-of-life');
        ClearCollect(colAndroidEOL, 'And_end-of-life');
        
        // 2. Check if the current user is in the restricted group
        Set(
            varIsAuthorized,
            !IsBlank(
                LookUp(
                    Office365Groups.ListGroupMembers("0663ba22-a28c-49a6-aa4b-4450f601ca7e").value,
                    mail = User().Email
                )
            )
        );
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false

