        Visible: =!IsBlank(varDeviceData)
        X: =40
        Y: =40
        ZIndex: =1

    Rectangle2 As rectangle:
        BorderColor: =RGBA(116, 116, 116, 1)
        BorderThickness: =2
        Fill: =RGBA(0, 0, 0, 0)
        Height: =394
        Width: =570
        X: =35
        Y: =164
        ZIndex: =2

    Rekisteröinti As button:
        Height: =218
        OnSelect: |-
            =// 1. First, check if they actually scanned a serial number
            If(
                IsBlank(varScannedSerial),
                Notify("Virhe: Skannaa laite ensin!", NotificationType.Error),
            
                // 2. Route based on the Dropdown selection
                Switch(
                    Laite_tyypin_valinta.Selected.Value,
                    
                    // 🪟 WINDOWS
                    "Windows",
                    Patch(
                        Today_Win, 
                        Defaults(Today_Win), 
                        { 
                            Title: varScannedSerial // This magically fills your "Laitteen sarjanumero" column!
                        }
                    );
                    Notify("Uusi laite (" & varScannedSerial & ") tallennettu Windows-listalle!", NotificationType.Success),
            
                    // 🍎 APPLE
                    "Apple",
                    Patch(
                        Today_iOS, 
                        Defaults(Today_iOS), 
                        { 
                            Title: varScannedSerial // This magically fills your "Serial number" column!
                        }
                    );
                    Notify("Uusi laite (" & varScannedSerial & ") tallennettu Apple-listalle!", NotificationType.Success),
            
                    // 🤖 ANDROID
                    "Android",
                    Patch(
                        Today_Android, 
                        Defaults(Today_Android), 
                        { 
                            Title: varScannedSerial // This magically fills your "Serial number" column!
                        }
                    );
                    Notify("Uusi laite (" & varScannedSerial & ") tallennettu Android-listalle!", NotificationType.Success),
            
                    // 💻 CHROMEBOOK (Placeholder)
                    "Chromebook",
                    Patch(
                        Today_Chromebook, 
                        Defaults(Today_Chromebook), 
                        { 
                            Title: varScannedSerial // This magically fills your "Otsikko" column!
                        }
                    );
                    Notify("Uusi laite (" & varScannedSerial & ") tallennettu Chromebook-listalle!", NotificationType.Success),
            
                    // ⚠️ IF NOTHING MATCHES
                    // Default action if they left it on "Valitse tyyppi..."
                    Notify("Virhe: Valitse laitetyyppi pudotusvalikosta ennen tallennusta!", NotificationType.Error)
                )
            );
            
            // 3. Reset the scanner and dropdown for the next device
            Set(varScannedSerial, Blank());
            Reset(Laite_tyypin_valinta);
        Size: =24
        Text: ="Register device"
        Visible: =varIsAuthorized
        Width: =236
        X: =35
        Y: =861
        ZIndex: =3

    "BarcodeReader1 As 'Barcode Reader'":
        BorderFillColor: =RGBA(47, 81, 151, 1)
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledContentColor: =RGBA(166, 166, 166, 1)
        DisabledFillColor: =RGBA(244, 244, 244, 1)
        DisplayMode: =DisplayMode.Edit
        FillColor: =RGBA(127, 178, 57, 1)
        Height: =218
        HoverBorderColor: =RGBA(88, 115, 171, 1)
        HoverContentColor: =RGBA(255, 255, 255, 1)
        HoverFillColor: =RGBA(47, 81, 151, 1)
        OnCancel: =false
        OnScan: |-
            =// 1) Lue skannauksen arvo
            Set(
                varScannedSerial,
                If(
                    CountRows(BarcodeReader1.Barcodes) > 0,
                    First(BarcodeReader1.Barcodes).Value,
                    Blank()
                )
            );
            
            // 2) Jos ei skannausta → ilmoitus + kevyt siivous, EI flow-kutsua
            If(
                IsBlank(varScannedSerial),
                Notify("⚠️ Viivakoodia ei luettu.", NotificationType.Warning);
                Set(varRawResponse, "");
                Set(varParsedData, Blank());
                Set(varDeviceData, Blank())
            );
            
            // 3) Jos skannaus ON → aja Flow (V1: positionaalinen) ja käsittele tulos
            If(
                !IsBlank(varScannedSerial),
            
                // 3a) Aja Flow ja tallenna raakateksti
                Set(
                    varRawResponse,
                    Coalesce(
                        'TheSearchFlowforPA'.Run(varScannedSerial).device_json,
                        ""
                    )
                );
            
                // 3b) Ei löytynyt
                If(
                    IsBlank(varRawResponse) || varRawResponse = "{}" || varRawResponse = "[]",
                    Notify("❌ Not found in any register.", NotificationType.Error);
                    Set(varParsedData, Blank());
                    Set(varDeviceData, Blank()),
            
                    // 3c) Löytyi → parse + cast + ilmoitus
                    Set(varParsedData, ParseJSON(varRawResponse));
                    Set(
                        varDeviceData,
                        {
                            Verkkonimi: Text(varParsedData.Verkkonimi),
                            DeviceName: Text(varParsedData.'Device name'),
                            Model:      Text(varParsedData.Model)
                            // Lisää muut kentät tarvittaessa
                        }
                    );
                    Notify(
                        "✅ Device Found: " &
                        Coalesce(
                            varDeviceData.Verkkonimi,
                            varDeviceData.DeviceName,
                            varDeviceData.Model,
                            "Unknown Device"
                        ),
                        NotificationType.Success
                    )
                );
            
                // (Valinnainen) tyhjennä käyttömielessä skannauksen välitila
                Set(varScannedSerial, Blank())
            );
        PressedBorderColor: =RGBA(56, 96, 178, 1)
        PressedContentColor: =RGBA(56, 96, 178, 1)
        PressedFillColor: =RGBA(255, 255, 255, 1)
        ScanningMode: ="BarcodeReaderScanningMode.AutomaticallyScan"
        TextColor: =RGBA(255, 255, 255, 1)
        Width: =236
        X: =369
        Y: =861
        ZIndex: =4

    txtSearchSerial As text:
