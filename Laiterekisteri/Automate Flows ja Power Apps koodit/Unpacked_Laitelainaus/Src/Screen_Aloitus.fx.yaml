Screen_Aloitus As screen:

    "BarcodeReader1 As 'Barcode Reader'":
        BarcodeType: ="Auto"
        BeepOnScan: =true
        BorderFillColor: =RGBA(47, 81, 151, 1)
        BorderRadius: =10
        BorderStyle: ="solid"
        BorderThickness: =2
        ContentLanguage: =""
        Disabled: =false
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledContentColor: =RGBA(166, 166, 166, 1)
        DisabledFillColor: =RGBA(244, 244, 244, 1)
        DisplayMode: =DisplayMode.Edit
        FillColor: =RGBA(127, 178, 57, 1)
        Font: ="'Open Sans', sans-serif"
        FontSize: =20
        FontWeight: ="600"
        Height: =249
        HoverBorderColor: =RGBA(88, 115, 171, 1)
        HoverContentColor: =RGBA(255, 255, 255, 1)
        HoverFillColor: =RGBA(47, 81, 151, 1)
        Italic: =false
        OnCancel: =false
        OnChange: =false
        OnScan: |-
            =// 1. Clear variables using the correct methods
            UpdateContext({varLainaaja: "", varYksikko: "", varMessage: ""});
            Set(varLastLoan, Blank()); // We use SET because this is a Global variable
            
            // 2. Find the device
            With(
                {
                    LoytynytLaite: LookUp(Lainalaitteet, Sarjanumero = First(BarcodeReader1.Barcodes).Value)
                },
            
                // 3. Check if found
                If(IsBlank(LoytynytLaite),
                    // CASE: Not Found
                    Notify("Virhe: Laitetta ei löydy!", NotificationType.Error);
                    Set(varScannedDevice, Blank()),
                
                    // CASE: Found
                    Set(varScannedDevice, LoytynytLaite); 
            
                    // 4. Determine Mode and Find Loan History
                    If(LoytynytLaite.Tila.Value = "Lainassa",
                        // Return Mode
                        Set(varMode, "Palautus");
                        // Find the specific open loan record
                        Set(varLastLoan, LookUp(Lainausloki, Title = LoytynytLaite.Title && IsBlank(PalautusPvm))),
                        
                        // Loan Mode
                        Set(varMode, "Lainaus")
                    );
                    
                    // 5. Move to next screen
                    Navigate(Screen_Tiedot, ScreenTransition.Fade)
                )
            )
        PaddingBottom: =5
        PaddingLeft: =5
        PaddingRight: =5
        PaddingTop: =5
        PreferFrontCamera: =false
        PressedBorderColor: =RGBA(56, 96, 178, 1)
        PressedContentColor: =RGBA(56, 96, 178, 1)
        PressedFillColor: =RGBA(255, 255, 255, 1)
        ScanningMode: ="BarcodeReaderScanningMode.AutomaticallyScan"
        ScanningQuality: ="Automatic"
        Strikethrough: =false
        TabIndex: =0
        Text: ="QR-Koodin Lukija"
        TextAlignment: ="center"
        TextColor: =RGBA(255, 255, 255, 1)
        Tooltip: =""
        Underline: =false
        VerticalAlign: ="middle"
        VibrateOnScan: =true
        Visible: =true
        Width: =335
        X: =152
        Y: =782
        ZIndex: =1

    Rectangle3_1 As rectangle:
        Fill: =RGBA(127, 178, 57, 1)
        Height: =80
        Width: =640
        ZIndex: =2

    Label1_1 As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =70
