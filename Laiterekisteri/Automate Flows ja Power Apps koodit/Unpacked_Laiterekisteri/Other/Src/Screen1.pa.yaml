Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Nollaa:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Icon: =Icon.CancelBadge
            OnSelect: =!IsBlank(varDeviceData)
            Visible: =!IsBlank(varDeviceData)
            X: =40
            Y: =40
      - Rectangle2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(116, 116, 116, 1)
            BorderThickness: =2
            Fill: =RGBA(0, 0, 0, 0)
            Height: =394
            Width: =570
            X: =35
            Y: =164
      - Rekisteröinti:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =218
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=// 1. First, check if they actually scanned a serial number\r\nIf(\r\n    IsBlank(varScannedSerial),\r\n    Notify(\"Virhe: Skannaa laite ensin!\", NotificationType.Error),\r\n\r\n    // 2. Route based on the Dropdown selection\r\n    Switch(\r\n        Laite_tyypin_valinta.Selected.Value,\r\n        \r\n        // \U0001FA9F WINDOWS\r\n        \"Windows\",\r\n        Patch(\r\n            Today_Win, \r\n            Defaults(Today_Win), \r\n            { \r\n                Title: varScannedSerial // This magically fills your \"Laitteen sarjanumero\" column!\r\n            }\r\n        );\r\n        Notify(\"Uusi laite (\" & varScannedSerial & \") tallennettu Windows-listalle!\", NotificationType.Success),\r\n\r\n        // \U0001F34E APPLE\r\n        \"Apple\",\r\n        Patch(\r\n            Today_iOS, \r\n            Defaults(Today_iOS), \r\n            { \r\n                Title: varScannedSerial // This magically fills your \"Serial number\" column!\r\n            }\r\n        );\r\n        Notify(\"Uusi laite (\" & varScannedSerial & \") tallennettu Apple-listalle!\", NotificationType.Success),\r\n\r\n        // \U0001F916 ANDROID\r\n        \"Android\",\r\n        Patch(\r\n            Today_Android, \r\n            Defaults(Today_Android), \r\n            { \r\n                Title: varScannedSerial // This magically fills your \"Serial number\" column!\r\n            }\r\n        );\r\n        Notify(\"Uusi laite (\" & varScannedSerial & \") tallennettu Android-listalle!\", NotificationType.Success),\r\n\r\n        // \U0001F4BB CHROMEBOOK (Placeholder)\r\n        \"Chromebook\",\r\n        Patch(\r\n            Today_Chromebook, \r\n            Defaults(Today_Chromebook), \r\n            { \r\n                Title: varScannedSerial // This magically fills your \"Otsikko\" column!\r\n            }\r\n        );\r\n        Notify(\"Uusi laite (\" & varScannedSerial & \") tallennettu Chromebook-listalle!\", NotificationType.Success),\r\n\r\n        // ⚠️ IF NOTHING MATCHES\r\n        // Default action if they left it on \"Valitse tyyppi...\"\r\n        Notify(\"Virhe: Valitse laitetyyppi pudotusvalikosta ennen tallennusta!\", NotificationType.Error)\r\n    )\r\n);\r\n\r\n// 3. Reset the scanner and dropdown for the next device\r\nSet(varScannedSerial, Blank());\r\nReset(Laite_tyypin_valinta);"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Register device"
            Visible: =varIsAuthorized
            Width: =236
            X: =35
            Y: =861
      - BarcodeReader1:
          Control: BarcodeReader@1.0.25
          Properties:
            FillColor: =RGBA(127, 178, 57, 1)
            Height: =218
            OnScan: |-
              =// 1) Lue skannauksen arvo
              Set(
                  varScannedSerial,
                  If(
                      CountRows(BarcodeReader1.Barcodes) > 0,
                      First(BarcodeReader1.Barcodes).Value,
                      Blank()
                  )
              );

              // 2) Jos ei skannausta → ilmoitus + kevyt siivous, EI flow-kutsua
              If(
                  IsBlank(varScannedSerial),
                  Notify("⚠️ Viivakoodia ei luettu.", NotificationType.Warning);
                  Set(varRawResponse, "");
                  Set(varParsedData, Blank());
                  Set(varDeviceData, Blank())
              );

              // 3) Jos skannaus ON → aja Flow (V1: positionaalinen) ja käsittele tulos
              If(
                  !IsBlank(varScannedSerial),

                  // 3a) Aja Flow ja tallenna raakateksti
                  Set(
                      varRawResponse,
                      Coalesce(
                          'TheSearchFlowforPA'.Run(varScannedSerial).device_json,
                          ""
                      )
                  );

                  // 3b) Ei löytynyt
                  If(
                      IsBlank(varRawResponse) || varRawResponse = "{}" || varRawResponse = "[]",
                      Notify("❌ Not found in any register.", NotificationType.Error);
                      Set(varParsedData, Blank());
                      Set(varDeviceData, Blank()),

                      // 3c) Löytyi → parse + cast + ilmoitus
                      Set(varParsedData, ParseJSON(varRawResponse));
                      Set(
                          varDeviceData,
                          {
                              Verkkonimi: Text(varParsedData.Verkkonimi),
                              DeviceName: Text(varParsedData.'Device name'),
                              Model:      Text(varParsedData.Model)
                              // Lisää muut kentät tarvittaessa
                          }
                      );
                      Notify(
                          "✅ Device Found: " &
                          Coalesce(
                              varDeviceData.Verkkonimi,
                              varDeviceData.DeviceName,
                              varDeviceData.Model,
                              "Unknown Device"
                          ),
                          NotificationType.Success
                      )
                  );

                  // (Valinnainen) tyhjennä käyttömielessä skannauksen välitila
                  Set(varScannedSerial, Blank())
              );
            ScanningMode: ="BarcodeReaderScanningMode.AutomaticallyScan"
            Width: =236
            X: =369
            Y: =861
      - txtSearchSerial:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Clear: =true
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Syötä sarjanumero..."
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Width: =365
            X: =152
            Y: =753
      - Laite_tyypin_valinta:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: =["Valitse tyyppi...", "Windows", "Apple", "Android", "Chromebook"]
            Items.Value: =Value
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Visible: =varIsAuthorized
            Width: =570
            X: =35
            Y: =591
      - Laiterekisteri_otsikko:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="LAITEREKISTERI"
            Width: =468
            X: =72
            Y: =40
      - Sarjanumero:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: |-
              ="Sarjanumero: " & varScannedSerial
            Visible: =!IsBlank(varDeviceData)
            X: =40
            Y: =220
      - Verkkonimi/Malli:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: |-
              =With(
                  {
                      // 1. Identify the Hardware ID based on the JSON keys
                      RawID: Coalesce(
                          Text(varParsedData.Model),               // What we told the Flow to send
                          Text(varParsedData.Malli),               // In case it got translated in the Flow
                          Text(varParsedData.'0.Model'),           // The old Windows key
                          Text(varParsedData.ProductName),         // Apple
                          Text(varParsedData.'Työaseman malli')    // Legacy fallback
                      ),
                      // 2. Identify the Device Name/User
                      DeviceName: Coalesce(
                          Text(varParsedData.Verkkonimi),
                          Text(varParsedData.'Device name')
                      )
                  },
                  With(
                      {
                          // 3. Search SharePoint using that RawID
                          MatchedAndroid: LookUp(colAndroidEOL, Model = RawID || 'Universal model name' = RawID),
                          MatchedApple: LookUp(colAppleEOL, Title = RawID || Model = RawID)
                      },
                      With(
                          {
                              // 4. Translate to Friendly Name if found
                              FriendlyModel: Coalesce(
                                  MatchedAndroid.'Universal model name', 
                                  MatchedApple.Title, 
                                  RawID
                              )
                          },
                          // 5. Display Result dynamically
                          If(
                              !IsBlank(DeviceName) && !IsBlank(FriendlyModel), "Verkkonimi: " & DeviceName & " / Malli: " & FriendlyModel,
                              !IsBlank(DeviceName), "Verkkonimi: " & DeviceName,
                              !IsBlank(FriendlyModel), "Malli: " & FriendlyModel,
                              ""
                          )
                      )
                  )
              )
            Visible: =!IsBlank(varDeviceData)
            X: =40
            Y: =290
      - Ostopäivä/Enrollment Date:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: |-
              =With(
                  {
                      // 1. Pick the first available Purchase Date field
                      RawP: Coalesce(
                          Text(varParsedData.Ostopäivä),
                          Text(varParsedData.PurchaseDate),
                          Text(varParsedData.'Purchase date')
                      ),
                      // 2. Pick the first available Enrollment Date field
                      RawE: Coalesce(
                          Text(varParsedData.'Enrollment date'),
                          Text(varParsedData.EnrollmentDate),
                          Text(varParsedData.'Enrolled date')
                      )
                  },
                  If(
                      !IsBlank(RawP),
                      "Ostopäivä: " & 
                          If(IsNumeric(RawP),
                              Text(DateAdd(DateTimeValue("12/30/1899"), Value(RawP, "en-US"), TimeUnit.Days), "d.m.yyyy"),
                              Text(DateValue(RawP), "d.m.yyyy")
                          ),
                      !IsBlank(RawE),
                      "Enrolled: " & 
                          If(IsNumeric(RawE),
                              Text(DateAdd(DateTimeValue("12/30/1899"), Value(RawE, "en-US"), TimeUnit.Days), "d.m.yyyy"),
                              Text(DateValue(RawE), "d.m.yyyy")
                          ),
                      ""
                  )
              )
            Visible: =!IsBlank(varDeviceData)
            X: =40
            Y: =360
      - Vuokranpäättyminen:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: "=With(\r\n    {\r\n        // 1. We now know for sure the Flow sends 'ProductName' for iPads\r\n        RawID: Trim(\r\n            Coalesce(\r\n                Text(varParsedData.ProductName),      // Apple ID (iPad11,1)\r\n                Text(varParsedData.Model),            // Android/Windows Model\r\n                Text(varParsedData.'Työaseman malli'), // Windows specific\r\n                Text(varParsedData.'Prodcut name')    // Typo fallback\r\n            )\r\n        )\r\n    },\r\n    If(\r\n        // 2. Check the Collections using the internal name 'Title'\r\n        !IsBlank(RawID) && \r\n        (\r\n            // Check Apple Collection (Using internal 'Title' name)\r\n            !IsBlank(LookUp(colAppleEOL, Title = RawID || Model = RawID)) ||\r\n            \r\n            // Check Android Collection\r\n            !IsBlank(LookUp(colAndroidEOL, Model = RawID || 'Universal model name' = RawID))\r\n            \r\n            // Note: If you have a Windows EOL list, you can add a third LookUp here!\r\n        ),\r\n        \r\n        // 3. Result\r\n        Color.Red,        // (Use \"⚠️ KIELLETTY MALLI\" here for the Text property)\r\n        Color.Transparent // (Use \"\" here for the Text property)\r\n    )\r\n)"
            Font: =Font.'Open Sans'
            Text: |+
              =With(
                  {
                      // 1. Identify the Hardware ID for the EOL check
                      RawID: Coalesce(
                  Text(varParsedData.ProductName),
                  Text(varParsedData.Model),
                  Text(varParsedData.'Työaseman malli')
              ),
                      // 2. Identify the Rent Date from various possible JSON keys
                      RawRentDate: Coalesce(
                          Text(varParsedData.'Vuokrauksen päättymispäivämäärä_x003a_'),
                          Text(varParsedData.Vuokranpäättyminen),
                          Text(varParsedData.Vuokranpaattyminen)
                      )
                  },
                  With(
                      {
                          // 3. Clean the date input (removing spaces, fixing commas) for potential Excel serials

                          CleanedDateInput: Substitute(
                              Substitute(
                                  Trim(Substitute(RawRentDate, Char(160), "")),
                                  " ", ""
                              ),
                              ",", "."
                          )

                      },
                      If(
                  // --- PRIORITY 1: Check End of Life ---
                  !IsBlank(RawID) &&
                  (
                      // For Apple
                      !IsBlank(LookUp(colAppleEOL, Title = RawID || Model = RawID)) ||
                      // For Android
                      !IsBlank(LookUp('And_end-of-life', Model = RawID || 'Universal model name' = RawID))
                  ),
                  "⚠️ KIELLETTY MALLI / END OF LIFE",
                          // --- PRIORITY 2: Handle Excel Serial Numbers (Numeric) ---
                          IsNumeric(CleanedDateInput) && !IsBlank(CleanedDateInput),
                          "Päättymispäivämäärä: " & Text(
                              DateAdd(
                                  DateTimeValue("12/30/1899"),
                                  Value(CleanedDateInput, "en-US"),
                                  TimeUnit.Days
                              ),

                              "d.m.yyyy"
                          ),
                          // --- PRIORITY 3: Handle Standard Date Text ---
                          !IsBlank(RawRentDate),
                          "Päättymispäivämäärä: " & Text(
                              IfError(
                                  DateValue(RawRentDate),
                                  IfError(
                                      DateTimeValue(RawRentDate),
                                      RawRentDate // If parsing fails, just show the raw text
                                  )
                              ),
                              "d.m.yyyy"
                          ),
                          // --- FALLBACK ---
                          ""  
                      )
                  )
              )

            X: =40
            Y: =430
      - Eduks_Logo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =131
            Image: ='Copy of eduks_tausta_valk_1080'
            Width: =171
            X: =434
            Y: =9
      - SearchSerialIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
            Height: =70
            Icon: =Icon.Search
            OnSelect: |-
              =// 1) Start loading
              Set(varLoading, true);

              // 2) Read input text safely
              Set(
                  varScannedSerial,
                  Trim(txtSearchSerial.Text)
              );

              // 3) If empty input → notify + clear
              If(
                  IsBlank(varScannedSerial),
                  Notify("⚠️ Syötä sarjanumero.", NotificationType.Warning);
                  Set(varRawResponse, "");
                  Set(varParsedData, Blank());
                  Set(varDeviceData, Blank());
                  Set(varLoading, false);
                  Exit()        // Lopettaa suorituksen ilman virheitä
              );

              // 4) Start Flow (V1 syntaksi)
              Set(
                  varRawResponse,
                  Coalesce(
                      'TheSearchFlowforPA'.Run(varScannedSerial).device_json
                  )
              );

              // 5) Käsittely
              If(
                  IsBlank(varRawResponse) || varRawResponse = "{}" || varRawResponse = "[]",
                  // CASE A: Not found
                  Notify("❌ Ei löytynyt", NotificationType.Error);
                  Set(varParsedData, Blank());
                  Set(varDeviceData, Blank()),

                  // CASE B: Found
              Set(varParsedData, ParseJSON(varRawResponse));
              Set(
                  varDeviceData,
                  {
                      Verkkonimi: Text(varParsedData.Verkkonimi),
                      DeviceName: Text(varParsedData.'Device name'),
                      // Check both cases for Model/model
                      Model: Coalesce(Text(varParsedData.Model), Text(varParsedData.model)),
                      // ADD THIS: Apple usually uses productName
                      ProductName: Text(varParsedData.productName)
                  }
              );
                  Notify(
                      "✅ Löytyi: " &
                      Coalesce(
                          varDeviceData.Verkkonimi,
                          varDeviceData.DeviceName,
                          varDeviceData.Model,
                          "Tuntematon laite"
                      ),
                      NotificationType.Success
                  )
              );

              // 6) Stop loading
              Set(varLoading, false);
            Width: =70
            X: =72
            Y: =753
